<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sites</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1115;color:#fff;font-family:Inter,sans-serif;padding:20px}
.h1{font-size:22px;font-weight:900}.sub{font-size:11px;color:#6a7085}
.header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.btn{padding:10px 18px;border-radius:12px;border:1px solid #222735;font-weight:700;cursor:pointer}
.btn-yellow{background:#facc15;color:#000}.btn-dark{background:#171a23;color:#fff}
.btn-mini{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:800;border:0;cursor:pointer}
.btn-y{background:#facc15;color:#000}.btn-r{background:rgba(239,68,68,.15);color:#f87171}.btn-g{background:rgba(34,197,94,.15);color:#22c55e}
.grid{display:grid;gap:14px}.grid-3{grid-template-columns:repeat(3,1fr)}@media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid-3{grid-template-columns:1fr}}
.card{background:#171a23;border:1px solid #222735;border-radius:16px;padding:16px;cursor:pointer}
.card:hover{border-color:#facc15}
.stat{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#0f1115;border:1px solid #1f2438;display:inline-block;margin:4px}
.stat-y{background:rgba(250,204,21,.15);color:#facc15}.stat-g{background:rgba(34,197,94,.15);color:#22c55e}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-box{background:#171a23;border:1px solid #222735;border-radius:16px;max-width:600px;width:100%}
.modal-head{padding:16px;font-weight:900;display:flex;justify-content:space-between;border-bottom:1px solid #222735;background:#0f1115}
.modal-body{padding:20px}
.input{width:100%;background:#0f1115;border:1px solid #222735;border-radius:12px;padding:11px 14px;color:#fff;outline:none}
.input:focus{border-color:#facc15}
.input-req{border:2px solid #facc15;background:rgba(250,204,21,.08)}
</style>
</head>
<body>
<div class="header">
<div><h1 class="h1">🏢 Gestion Sites - Module 6</h1><p class="sub">Si tu vois Cannot GET, c'est que /central/site/depot.html n'existe pas encore</p></div>
<button onclick="openCreate()" class="btn btn-yellow">+ Nouveau Site</button>
</div>
<div id="grid" class="grid grid-3"></div>

<div class="modal-overlay" id="createModal">
<div class="modal-box">
<div class="modal-head"><span>➕ Nouveau Site</span><button onclick="closeCreate()" style="background:0;border:0;color:#fff;font-size:22px">×</button></div>
<div class="modal-body" style="display:grid;gap:12px">
<div><label style="font-size:10px;color:#facc15">Nom Site *</label><input id="s_nom" class="input input-req" placeholder="Ex: Site Kintambo"></div>
<div><label style="font-size:10px;color:#5a6085">Localisation</label><input id="s_loc" class="input" placeholder="Kintambo"></div>
<div><label style="font-size:10px;color:#5a6080">Responsable</label><input id="s_resp" class="input" placeholder="Nom"></div>
<div style="display:flex;gap:10px"><button onclick="closeCreate()" class="btn btn-dark" style="flex:1">Annuler</button><button onclick="saveSite()" class="btn btn-yellow" style="flex:2">💾 Créer</button></div>
<p id="msg" style="font-size:11px;text-align:center;font-weight:700"></p>
</div>
</div>
</div>

<script>
const KEY_SITES='dub_sites';
const KEY_SITE_PRODS='dub_sites_produits';
function getSites(){try{return JSON.parse(localStorage.getItem(KEY_SITES)||'[]')}catch(e){return []}}
function getSiteProds(){try{return JSON.parse(localStorage.getItem(KEY_SITE_PRODS)||'{}')}catch(e){return {}}}
function saveSites(l){localStorage.setItem(KEY_SITES,JSON.stringify(l))}
function saveSiteProds(o){localStorage.setItem(KEY_SITE_PRODS,JSON.stringify(o))}

function render(){
 let sites=getSites();
 let sp=getSiteProds();
 document.getElementById('grid').innerHTML=sites.map(s=>{
  let list=sp[s.id]||[];
  return `<div class="card">
   <div style="font-weight:900">🏢 ${s.nom}</div><div style="font-size:11px;color:#6a7085">📍 ${s.localisation||'-'} • 👤 ${s.responsable||'-'}</div>
   <div style="margin-top:10px"><span class="stat">📦 ${list.length} produits</span></div>
   <div style="margin-top:10px;display:flex;gap:6px">
    <button class="btn-mini btn-y" onclick="goSite('${s.id}')">Gérer / Ouvrir Dépôt</button>
    <button class="btn-mini btn-r" onclick="delSite('${s.id}')">Suppr</button>
   </div>
  </div>`;
 }).join('')||`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6a7085">Aucun site. Crée ton premier site.<br><br>Si tu as l'erreur Cannot GET /central/site/depot.html<br>=> Crée dossier central/site/ et fichier depot.html</div>`;
}
function openCreate(){document.getElementById('createModal').classList.add('show')}
function closeCreate(){document.getElementById('createModal').classList.remove('show')}

function saveSite(){
 let nom=s_nom.value.trim(); if(!nom) return alert('Nom obligatoire');
 let sites=getSites();
 if(sites.find(s=>s.nom.toLowerCase()===nom.toLowerCase())){
   document.getElementById('msg').textContent='❌ Site existe déjà - anti doublon'; 
   document.getElementById('msg').style.color='#f87171';
   return;
 }
 let obj={id:Date.now().toString(),nom:nom,localisation:s_loc.value.trim(),responsable:s_resp.value.trim(),createdAt:new Date().toISOString()};
 sites.unshift(obj); saveSites(sites);
 let sp=getSiteProds(); sp[obj.id]=[]; saveSiteProds(sp);
 document.getElementById('msg').textContent='✅ Site créé: '+nom; 
 document.getElementById('msg').style.color='#22c55e';
 s_nom.value=''; s_loc.value=''; s_resp.value='';
 render();
 // FIX: On ne redirige plus automatiquement pour éviter Cannot GET
 setTimeout(()=>{closeCreate(); document.getElementById('msg').textContent='';},1200);
}

function delSite(id){
 if(!confirm('Supprimer site ?')) return;
 let sites=getSites().filter(s=>String(s.id)!==String(id)); saveSites(sites);
 let sp=getSiteProds(); delete sp[id]; saveSiteProds(sp); render();
}

function goSite(id){
  let target=`/central/site/depot.html?siteId=${id}`;
  // Vérifie si le fichier existe avant de rediriger
  fetch(target, {method:'HEAD'}).then(r=>{
    if(!r.ok){
      alert('❌ Fichier introuvable: '+target+'\n\nCrée le dossier central/site/ et le fichier depot.html avec le code que je t\'ai donné.\n\nPour l\'instant je t\'ouvre stock-par-site.html');
      location.href=`/central/site/stock-par-site.html?siteId=${id}`;
    } else {
      // Si dans app.html avec iframe
      try{
        let iframe=window.parent.document.querySelector('iframe');
        if(iframe){ iframe.src=target; return; }
      }catch(e){}
      location.href=target;
    }
  }).catch(()=>{
    alert('❌ Impossible d\'ouvrir '+target+' - Vérifie que le fichier existe dans ton projet.');
  });
}

render();
</script>
</body>
</html>
