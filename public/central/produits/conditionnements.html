<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conditionnements</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"></head>
<body class="bg-[#f5f5f7] min-h-screen">
<div class="max-w-4xl mx-auto px-6 py-6">
<div class="flex items-center gap-3 mb-6">
<a href="../produits.html" class="w-9 h-9 bg-black text-white rounded-full flex items-center justify-center"><i class="ri-arrow-left-line"></i></a>
<h1 class="text-xl font-bold">Conditionnements</h1>
<button onclick="add()" class="ml-auto px-4 py-2 bg-black text-white rounded-xl text-sm"><i class="ri-add-line"></i> Nouveau</button>
</div>
<div class="bg-white border rounded-2xl overflow-hidden">
<table class="w-full text-sm"><thead class="bg-gray-50 text-[11px] uppercase text-gray-500"><tr><th class="text-left p-3">Conditionnement</th><th class="text-left p-3">Conversion</th><th class="text-right p-3">Action</th></tr></thead>
<tbody class="divide-y" id="tbody"></tbody></table>
</div>
<p id="msg" class="text-center text-sm mt-4 font-bold text-green-600"></p>
<p class="text-center text-xs text-gray-400 mt-2">Ex : 1 BT = 3 PLQ | 1 CTN = 12 BT | 1 Bidon = 25 L</p>
</div>
<script>
const KEY='dubenzen_conditionnements';
const DEFAULTS=[
 {nom:'PLQ', desc:'Plaquette', unite_vente:'PLQ', unite_achat:'BT', contenance:1},
 {nom:'BT', desc:'Boîte', unite_vente:'PLQ', unite_achat:'BT', contenance:3},
 {nom:'FL', desc:'Flacon', unite_vente:'FL', unite_achat:'FL', contenance:1},
 {nom:'AMP', desc:'Ampoule', unite_vente:'AMP', unite_achat:'BT', contenance:10},
 {nom:'CTN', desc:'Carton', unite_vente:'BT', unite_achat:'CTN', contenance:12},
 {nom:'Bidon 5L', desc:'Liquide', unite_vente:'L', unite_achat:'Bidon', contenance:5},
 {nom:'Bidon 25L', desc:'Liquide', unite_vente:'L', unite_achat:'Bidon', contenance:25},
];
function getList(){ try{ let s=JSON.parse(localStorage.getItem(KEY)||'[]'); return [...DEFAULTS, ...s]; }catch(e){ return [...DEFAULTS]; } }
function getSavedOnly(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
function render(){
 let list=getList();
 document.getElementById('tbody').innerHTML=list.map((c,i)=>`
 <tr><td class="p-3 font-medium">${c.nom} <span class="text-xs text-gray-400">${c.desc||''}</span></td>
 <td class="p-3">1 ${c.unite_achat||c.nom} = ${c.contenance||1} ${c.unite_vente||''}</td>
 <td class="p-3 text-right">${i>=DEFAULTS.length?`<button onclick="del(${i})" class="text-red-500"><i class="ri-delete-bin-line"></i></button>`:`<span class="text-[10px] text-gray-400">Défaut</span>`}</td></tr>`).join('');
}
function add(){
 let nom=prompt('Nom (BT, PLQ, FL, CTN, Bidon 20L...) :'); if(!nom||!nom.trim()) return;
 let uv=prompt('Unité STOCK / VENTE (PLQ, L, PCE...) :')||'PLQ';
 let ua=prompt('Unité ACHAT (BT, CTN, Bidon...) :')||nom.trim();
 let cont=prompt('Contenance - 1 '+ua+' = combien de '+uv+' ? Ex: 3')||'1';
 let saved=getSavedOnly(); saved.push({nom:nom.trim(), desc:'', unite_vente:uv.trim().toUpperCase(), unite_achat:ua.trim().toUpperCase(), contenance:+cont||1});
 localStorage.setItem(KEY, JSON.stringify(saved)); render();
 document.getElementById('msg').textContent=`✅ ${nom.trim()} créé : 1 ${ua} = ${cont} ${uv}`;
 setTimeout(()=>document.getElementById('msg').textContent='',2500);
}
function del(i){ if(i<DEFAULTS.length) return alert('Tu ne peux pas supprimer une valeur par défaut Boss'); if(!confirm('Supprimer ?')) return; let s=getSavedOnly(); s.splice(i-DEFAULTS.length,1); localStorage.setItem(KEY, JSON.stringify(s)); render(); }
render();
</script>
</body></html>
