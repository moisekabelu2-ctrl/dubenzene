<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Catégories</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"></head>
<body class="bg-[#f5f5f7] min-h-screen">
<div class="max-w-4xl mx-auto px-6 py-6">
  <div class="flex items-center gap-3 mb-6">
    <a href="../produits.html" class="w-9 h-9 bg-black text-white rounded-full flex items-center justify-center"><i class="ri-arrow-left-line"></i></a>
    <h1 class="text-xl font-bold">Catégories</h1>
    <button onclick="add()" class="ml-auto px-4 py-2 bg-black text-white rounded-xl text-sm"><i class="ri-add-line"></i> Nouvelle</button>
  </div>
  <div class="bg-white border rounded-2xl overflow-hidden">
    <table class="w-full text-sm"><thead class="bg-gray-50 text-[11px] uppercase text-gray-500"><tr><th class="text-left p-3">Nom</th><th class="text-left p-3">Produits</th><th class="text-right p-3">Action</th></tr></thead>
    <tbody class="divide-y" id="tbody">
      <tr><td class="p-3 font-medium">Benzène</td><td class="p-3">124 produits</td><td class="p-3 text-right"><button class="text-red-500"><i class="ri-delete-bin-line"></i></button></td></tr>
      <tr><td class="p-3 font-medium">Gasoil</td><td class="p-3">89 produits</td><td class="p-3 text-right"><button class="text-red-500"><i class="ri-delete-bin-line"></i></button></td></tr>
      <tr><td class="p-3 font-medium">pharmacie</td><td class="p-3">2 661 produits</td><td class="p-3 text-right"><button class="text-red-500"><i class="ri-delete-bin-line"></i></button></td></tr>
    </tbody></table>
  </div>
</div>
<script>
function add(){
  const nom = prompt('Nom catégorie:');
  if(!nom) return;
  document.getElementById('tbody').innerHTML += `<tr><td class="p-3 font-medium">${nom}</td><td class="p-3">0 produits</td><td class="p-3 text-right"><button class="text-red-500"><i class="ri-delete-bin-line"></i></button></td></tr>`;
}
</script>
</body></html>
