<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contenances</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"></head>
<body class="bg-[#f5f5f7] min-h-screen">
<div class="max-w-4xl mx-auto px-6 py-6">
<div class="flex items-center gap-3 mb-6">
<a href="../produits.html" class="w-9 h-9 bg-black text-white rounded-full flex items-center justify-center"><i class="ri-arrow-left-line"></i></a>
<h1 class="text-xl font-bold">Contenances - Conversions</h1>
<button onclick="add()" class="ml-auto px-4 py-2 bg-black text-white rounded-xl text-sm"><i class="ri-add-line"></i> Nouvelle</button>
</div>
<div class="bg-white border rounded-2xl overflow-hidden">
<table class="w-full text-sm"><thead class="bg-gray-50 text-[11px] uppercase text-gray-500"><tr><th class="text-left p-3">Conversion</th><th class="text-left p-3">Exemple</th><th class="text-right p-3">Action</th></tr></thead>
<tbody class="divide-y" id="tbody"></tbody></table>
</div>
</div>
<script>
const KEY='dubenzen_contenances';
const DEFAULTS=[
 {de:'BT', vers:'PLQ', val:3, ex:'1 BT CLAMOXYL = 3 PLQ'},
 {de:'BT', vers:'PLQ', val:10, ex:'1 BT PARACETAMOL = 10 PLQ'},
 {de:'CTN', vers:'BT', val:12, ex:'1 CTN = 12 BT'},
 {de:'Bidon', vers:'L', val:25, ex:'1 Bidon = 25 L'},
 {de:'Bidon', vers:'L', val:5, ex:'1 Bidon = 5 L'},
];
function getList(){ try{ let s=JSON.parse(localStorage.getItem(KEY)||'[]'); return [...DEFAULTS, ...s]; }catch(e){ return [...DEFAULTS]; } }
function render(){
 document.getElementById('tbody').innerHTML=getList().map((c,i)=>`
 <tr><td class="p-3 font-medium">1 ${c.de} = ${c.val} ${c.vers}</td><td class="p-3 text-gray-500">${c.ex||''}</td>
 <td class="p-3 text-right">${i>=DEFAULTS.length?`<button onclick="del(${i})" class="text-red-500"><i class="ri-delete-bin-line"></i></button>`:`<span class="text-[10px] text-gray-400">Défaut</span>`}</td></tr>`).join('');
}
function add(){
 let de=prompt('De (BT, CTN, Bidon) :'); if(!de) return;
 let val=prompt('1 '+de+' = combien ? Ex: 3'); if(!val) return;
 let vers=prompt('Vers (PLQ, BT, L) :')||'PLQ';
 let ex=prompt('Exemple (ex: 1 BT CLAMOXYL = 3 PLQ)')||'';
 let s=[]; try{ s=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){} s.push({de:de.trim().toUpperCase(), vers:vers.trim().toUpperCase(), val:+val||1, ex:ex});
 localStorage.setItem(KEY, JSON.stringify(s)); render();
}
function del(i){ if(i<DEFAULTS.length) return alert('Défaut - ne pas supprimer'); if(!confirm('Supprimer ?')) return; let s=JSON.parse(localStorage.getItem(KEY)||'[]'); s.splice(i-DEFAULTS.length,1); localStorage.setItem(KEY, JSON.stringify(s)); render(); }
render();
</script>
</body></html>
