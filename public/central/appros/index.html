<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approvisionnement</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8FAFC;padding:24px;font-family:Inter,system-ui,sans-serif;color:#0f172a}
.wrap{max-width:896px;margin:0 auto}
h1{font-size:30px;font-weight:900;margin-bottom:8px}
.sub{color:#64748b;margin-bottom:32px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{display:block;background:#fff;padding:24px;border-radius:16px;border:1px solid #e2e8f0;text-decoration:none;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.card:hover{border-color:#3b82f6}
.card.dark{background:#0f172a;color:#fff;border-color:#0f172a}
.card.dark:hover{background:#000}
.icon{font-size:30px}
.card-title{font-weight:700;margin-top:8px;font-size:16px}
.card-desc{font-size:14px;color:#64748b;margin-top:2px}
.card.dark .card-desc{color:#cbd5e1}
.btn-back{display:inline-block;margin-top:32px;background:#fff;border:1px solid #e2e8f0;padding:10px 20px;border-radius:12px;font-weight:700;text-decoration:none;color:#0f172a}
</style>
</head>
<body>
<div class="wrap">
<h1>Approvisionnement</h1>
<p class="sub">Dépôt Central → 10 Sites</p>
<div class="grid">
<a href="reappro.html" class="card"><div class="icon">📦</div><div class="card-title">Réapprovisionnements</div><div class="card-desc">Dépôt ou Site Direct</div></a>
<a href="transfert.html" class="card dark"><div class="icon">🚚</div><div class="card-title">Transfert Dépôt → Site</div><div class="card-desc">Envoyer vers Matadi, Gombe, etc.</div></a>
<a href="../commandes/index.html" class="card"><div class="icon">⚠️</div><div class="card-title">Commandes / Stock Bas</div><div class="card-desc">Voir ce qui manque</div></a>
<a href="fournisseurs.html" class="card"><div class="icon">👥</div><div class="card-title">Fournisseurs</div><div class="card-desc">Teddy Pharma, etc.</div></a>
</div>
<a href="../app.html" class="btn-back">← Retour Dépôt Central</a>
</div>
</body>
</html>
