<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;height:100vh;overflow:hidden}
.menu{
  width:280px;
  min-width:280px;
  background:#0a0e1a;
  color:white;
  padding:20px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.content-wrap{
  flex:1;
  background:#f5f5f7;
  overflow-y:auto;
  height:100vh;
  padding:20px;
}
</style>
</head>
<body>

<div class="menu">
  MENU FIXE<br><br>
  ✅ Ne bouge plus<br><br>
  Dashboard<br><br>Produits<br><br>Stock
</div>

<div class="content-wrap">
  <div style="height:2000px;background:white;padding:20px;border-radius:12px">
    CONTENU QUI SCROLLE<br><br>
    Scrolle ici en bas...<br><br>
    Le menu à gauche reste fixe ✅
  </div>
</div>

</body>
</html>
