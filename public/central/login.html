<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dubenzene-ERP V2 - Login</title>
<style>
*{box-sizing:border-box}body{font-family:Inter,Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0e1a;margin:0}
.card{background:#151a26;border:1px solid #232a3d;padding:32px;border-radius:22px;width:380px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.logo{width:48px;height:48px;background:#facc15;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:20px;margin-bottom:16px}
h2{margin:0 0 6px;font-weight:900;font-size:20px}h2 span{color:#facc15}.sub{font-size:11px;color:#5a6080;margin-bottom:24px;letter-spacing:0.5px}
input,select{width:100%;padding:13px 14px;margin:8px 0;border-radius:12px;border:1px solid #232a3d;background:#0f1219;color:#fff;font-size:14px;outline:none}
input:focus,select:focus{border-color:#facc15}
button{width:100%;padding:13px;background:#facc15;color:#000;border:0;margin-top:14px;border-radius:12px;font-weight:900;cursor:pointer;font-size:14px}
#msg{font-size:12px;margin-top:14px;text-align:center;min-height:18px}#msg.ok{color:#22c55e}#msg.err{color:#ff6b6b}#msg.load{color:#facc15}
.footer{margin-top:20px;text-align:center;font-size:10px;color:#3a415c}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid;margin-top:6px}
</style>
</head>
<body>
<div class="card">
<div class="logo">D</div>
<h2><span>DUBENZENE</span> ERP V2</h2>
<p class="sub">CENTRAL • BUKAVU • SECURE ACCESS</p>
<select id="userSelect" onchange="onSelectUser()"><option value="">Choisir ton nom...</option></select>
<input id="user" placeholder="Nom d'utilisateur">
<input id="pass" type="password" placeholder="PIN / Mot de passe">
<button id="btn" onclick="go()">Connexion →</button>
<p id="msg"></p>
<div id="info" style="font-size:10px;color:#5a6080;text-align:center;margin-top:8px"></div>
<div class="footer">© 2025 Dubenzene • Pare 80/20 • Vendeur = Stock Site + Vente</div>
</div>
<script>
const KEY_USERS='dub_users';const KEY_SITES='dub_sites';const KEY_CURRENT='dub_current_user_id';
function getUsers(){try{return JSON.parse(localStorage.getItem(KEY_USERS)||'[]')}catch{return[]}}
function loadUsersSelect(){
 let users=getUsers();
 document.getElementById('userSelect').innerHTML='<option value="">Choisir ton nom...</option>'+users.map(u=>`<option value="${u.id}">${u.nom} - ${u.role.toUpperCase()} ${u.siteName?'• '+u.siteName:''}</option>`).join('');
 if(users.length===0) document.getElementById('info').innerHTML='Aucun user. Va dans central/utilisateurs.html et crée ADMIN';
}
function onSelectUser(){
 let id=document.getElementById('userSelect').value; if(!id) return;
 let u=getUsers().find(x=>String(x.id)===String(id));
 if(u){document.getElementById('user').value=u.nom;document.getElementById('info').innerHTML=`<span class="badge" style="color:${u.role==='admin'?'#facc15':'#22c55e'};border-color:currentColor">${u.role.toUpperCase()} ${u.siteName||''}</span><br>PIN pour ${u.nom}`;document.getElementById('pass').focus();}
}
async function go(){
 const username=document.getElementById('user').value.trim();
 const password=document.getElementById('pass').value.trim();
 const msgEl=document.getElementById('msg'); const btnEl=document.getElementById('btn');
 if(!username||!password){msgEl.className='err';msgEl.innerText='Remplis les 2 champs Boss';return;}
 msgEl.className='load';msgEl.innerText='Connexion...';btnEl.disabled=true;

 // LOCAL LOGIN
 let users=getUsers();
 let localUser=users.find(u=>u.nom.toLowerCase()===username.toLowerCase() && String(u.pin)===String(password));
 if(localUser){
   localStorage.setItem(KEY_CURRENT,localUser.id);
   localStorage.setItem('user',JSON.stringify(localUser));
   localStorage.setItem('isLogged','true');
   msgEl.className='ok'; msgEl.innerText=`OK ${localUser.nom} ✅ ${localUser.role.toUpperCase()} → Redirection...`;
   
   // REDIRECTION PAR ROLE - VERSION FINALE CORRIGÉE
   let dest='/central/app.html'; // admin par défaut
   if(localUser.role==='vendeur' || localUser.role==='vendeuse'){
     dest='/central/vendeurs/index.html';
   } else if(localUser.role==='manager'){
     dest='/central/manager/index.html';
   } else if(localUser.role==='appro'){
     dest='/central/sites.html';
   }
   
   setTimeout(()=>window.location.href=dest, 600);
   return;
 }
 msgEl.className='err';msgEl.innerText='PIN invalide - Vérifie dans utilisateurs.html';btnEl.disabled=false;
}
document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
loadUsersSelect();
</script>
</body>
</html>
