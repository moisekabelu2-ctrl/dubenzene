<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alertes</title></head>
<body style="background:#05070a;color:#fff;font-family:Arial;padding:14px">
<style>.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px}.input,.sel{width:100%;background:#000;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;color:#fff;outline:none;margin-bottom:10px}.btn{border:none;padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer}.row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.badge{padding:4px 9px;border-radius:100px;font-size:11px;font-weight:900}.qteInput{width:90px;background:#000;color:#facc15;border:2px solid #facc15;border-radius:10px;padding:10px;font-size:18px;font-weight:900;text-align:center}.tab{flex:1;padding:12px;border-radius:12px;border:none;font-weight:900;cursor:pointer;background:#1f2937;color:#fff}.tab.on{background:#facc15;color:#000}</style>
<h2>⚠️ Alertes - <span id="totalAlertes">0</span></h2>
<div style="display:flex;gap:8px;margin-bottom:12px"><button id="tabAlertes" class="tab on" onclick="setOnglet('ALERTES')">⚠️ ALERTES</button><button id="tabHist" class="tab" onclick="setOnglet('HIST')">📜 HISTORIQUE</button></div>
<div class="card" id="blocAlertes">
<select id="filtreSite" class="sel" onchange="render()"><option value="TOUT">Tous les sites</option></select>
<select id="filtreType" class="sel" onchange="render()"><option value="TOUT">Tous les types</option><option value="DEMANDE">🚚 Demandes stock</option><option value="MESSAGE">💬 Messages</option><option value="RUPTURE">🔴 Ruptures</option><option value="STOCK_BAS">🟡 Stock bas</option></select>
<input id="search" class="input" placeholder="🔍 Rechercher..." autocomplete="off">
<div id="sectionDemandes"></div><div id="sectionStock"></div>
</div>
<div class="card" id="blocHist" style="display:none">
<select id="filtreSiteHist" class="sel" onchange="renderHist()"><option value="TOUT">Tous les sites</option></select>
<select id="filtreStatutHist" class="sel" onchange="renderHist()"><option value="TOUT">Tous les statuts</option><option value="En attente">🟡 En attente</option><option value="Expédiée">🔵 Expédiée</option><option value="Livrée">🟢 Livrée</option><option value="Lu">🟣 Lu</option></select>
<select id="filtreTypeHist" class="sel" onchange="renderHist()"><option value="TOUT">Stock + Messages</option><option value="STOCK">📦 Stock seulement</option><option value="MESSAGE">💬 Messages seulement</option></select>
<input id="searchHist" class="input" placeholder="🔍 Rechercher dans historique..." autocomplete="off">
<div id="histStats" style="font-size:13px;color:#94a3b8;margin-bottom:10px"></div>
<div id="sectionHist"></div>
</div>
<div id="bonModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);padding:14px;overflow:auto"><div style="background:#fff;color:#000;border-radius:18px;padding:20px;max-width:480px;margin:20px auto"><h2 style="text-align:center">📦 BON DE LIVRAISON<br>DUBENZENE</h2><div id="bonContenu"></div><button onclick="document.getElementById('bonModal').style.display='none'" style="width:100%;padding:12px;border-radius:12px;background:#000;color:#fff;font-weight:900;margin-top:14px;cursor:pointer">FERMER</button><button onclick="window.print()" style="width:100%;padding:12px;border-radius:12px;background:#facc15;font-weight:900;margin-top:8px;cursor:pointer;border:none">🖨️ IMPRIMER</button></div></div>
<script>
var ONGLET='ALERTES';
function setOnglet(v){ONGLET=v;document.getElementById('blocAlertes').style.display=v==='ALERTES'?'block':'none';document.getElementById('blocHist').style.display=v==='HIST'?'block':'none';document.getElementById('tabAlertes').classList.toggle('on',v==='ALERTES');document.getElementById('tabHist').classList.toggle('on',v==='HIST');if(v==='HIST')renderHist();else render();}
function getNomSite(code){if(!code)return 'SITE INCONNU';try{var sites=JSON.parse(localStorage.getItem('dub_sites')||'[]');for(var i=0;i<sites.length;i++){var s=sites[i];var c=typeof s==='string'?s:(s.code||s.id||s.nom);var n=typeof s==='string'?s:(s.nom||s.name||s.siteNom);if(String(c).toLowerCase()===String(code).toLowerCase()&&n)return String(n).toUpperCase();}}catch(e){}try{var users=JSON.parse(localStorage.getItem('dub_users')||'[]');for(var j=0;j<users.length;j++){if(String(users[j].site||users[j].siteId||'').toLowerCase()===String(code).toLowerCase()&&users[j].siteNom)return String(users[j].siteNom).toUpperCase();}}catch(e){}return String(code).replace(/[-_]/g,' ').toUpperCase();}
function getSP(){try{return JSON.parse(localStorage.getItem('dub_sites_produits')||'{}')}catch(e){return{}}}
function getCmd(){try{return JSON.parse(localStorage.getItem('dub_commandes_depot')||'[]')}catch(e){return[]}}
function saveCmd(l){localStorage.setItem('dub_commandes_depot',JSON.stringify(l));}
function getStock(p){return +p.stock||+p.stock_site||+p.quantite||+p.qte||0}
function normaliser(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').trim();}
function getStockDepot(produit){var nom=String(produit||'').toLowerCase().trim();var cles=['dub_produits','dub_stock_depot','dub_depot_produits','dub_stock_central','dub_central_produits','dub_produits_central'];for(var i=0;i<cles.length;i++){try{var raw=JSON.parse(localStorage.getItem(cles[i])||'[]');if(Array.isArray(raw)){for(var j=0;j<raw.length;j++){if(String(raw[j].nom||raw[j].name||'').toLowerCase().trim()===nom){return{stock:getStock(raw[j]),source:cles[i],index:j};}}}else if(raw&&typeof raw==='object'){for(var k in raw){if(Array.isArray(raw[k])){for(var m=0;m<raw[k].length;m++){if(String(raw[k][m].nom||raw[k][m].name||'').toLowerCase().trim()===nom)return{stock:getStock(raw[k][m]),source:cles[i],index:m,key:k};}}}}}catch(e){}}return{stock:0,source:null,index:-1};}
function retirerStockDepot(produit,qte){var info=getStockDepot(produit);if(!info.source)return;try{var raw=JSON.parse(localStorage.getItem(info.source)||'[]');var p=null;if(Array.isArray(raw))p=raw[info.index];else if(info.key)p=raw[info.key][info.index];if(!p)return;var nv=Math.max(0,getStock(p)-Number(qte||0));p.stock=nv;p.stock_site=nv;p.quantite=nv;p.qte=nv;p.stock_depot=nv;localStorage.setItem(info.source,JSON.stringify(raw));}catch(e){}}
function remplirFiltreSite(){var codes=[];getCmd().forEach(function(c){if(c.siteId&&codes.indexOf(c.siteId)===-1)codes.push(c.siteId);});var sp=getSP();for(var k in sp){if(codes.indexOf(k)===-1)codes.push(k);}var sel=document.getElementById('filtreSite');var actuel=sel.value;sel.innerHTML='<option value="TOUT">Tous les sites</option>'+codes.map(function(code){return '<option value="'+code+'">'+getNomSite(code)+'</option>';}).join('');sel.value=actuel||'TOUT';var selH=document.getElementById('filtreSiteHist');var actuelH=selH.value;selH.innerHTML='<option value="TOUT">Tous les sites</option>'+codes.map(function(code){return '<option value="'+code+'">'+getNomSite(code)+'</option>';}).join('');selH.value=actuelH||'TOUT';}
function validerEtEnvoyer(id){var input=document.getElementById('qte-'+id);var qteEnvoyee=parseInt(input.value||'0');var list=getCmd();var cmd=null;list.forEach(function(c){if(String(c.id)===String(id))cmd=c;});if(!cmd)return;if(!qteEnvoyee||qteEnvoyee<=0)return alert('Mets la quantite envoyee');var stockDepot=getStockDepot(cmd.produit).stock;if(qteEnvoyee>stockDepot){alert('❌ IMPOSSIBLE\n\nStock dépôt : '+stockDepot+' pcs\nTu veux envoyer : '+qteEnvoyee+' pcs\n\nRéduis à '+stockDepot+' ou moins.');input.value=stockDepot;input.style.borderColor='#ef4444';input.style.color='#f87171';return;}if(!confirm('Envoyer '+qteEnvoyee+' x '+cmd.produit+' a '+getNomSite(cmd.siteId)+' ?\nDemandé : '+cmd.qte+' | Envoyé : '+qteEnvoyee+' | Reste dépôt : '+(stockDepot-qteEnvoyee)))return;cmd.qteDemandee=cmd.qte;cmd.qteEnvoyee=qteEnvoyee;cmd.statut='Expédiée';cmd.envoyePar='Dépôt Central';cmd.dateEnvoi=new Date().toISOString();cmd.stockDepotAvant=stockDepot;cmd.stockDepotApres=stockDepot-qteEnvoyee;saveCmd(list);retirerStockDepot(cmd.produit,qteEnvoyee);var hD=[];try{hD=JSON.parse(localStorage.getItem('dub_historique_depot')||'[]')}catch(e){}hD.unshift({siteNom:getNomSite(cmd.siteId),demandeur:cmd.demandeur||cmd.gerant,produit:cmd.produit,qteDemandee:cmd.qteDemandee,qteEnvoyee:qteEnvoyee,stockDepotAvant:stockDepot,stockDepotApres:stockDepot-qteEnvoyee,action:'ENVOYÉ',envoyePar:'Dépôt Central',date:new Date().toISOString()});localStorage.setItem('dub_historique_depot',JSON.stringify(hD));afficherBon(cmd);render();}
function afficherBon(c){document.getElementById('bonModal').style.display='block';document.getElementById('bonContenu').innerHTML='<p><b>N° Bon :</b> BON-'+c.id+'</p><p><b>Date :</b> '+new Date().toLocaleString('fr-FR')+'</p><hr><p><b>📍 SITE :</b><br><span style="font-size:20px;font-weight:900">'+getNomSite(c.siteId)+'</span></p><p><b>👤 DEMANDÉ PAR :</b><br><b>'+(c.demandeur||c.gerant||'Inconnu')+'</b></p><p><b>📦 PRODUIT :</b><br><b>'+c.produit+'</b></p><table style="width:100%;border-collapse:collapse;margin-top:10px"><tr><th style="border:1px solid #000;padding:8px;text-align:left">Demandé</th><th style="border:1px solid #000;padding:8px;text-align:left">Envoyé</th><th style="border:1px solid #000;padding:8px;text-align:left">Reste dépôt</th></tr><tr><td style="border:1px solid #000;padding:8px">'+(c.qteDemandee||c.qte)+'</td><td style="border:1px solid #000;padding:8px;font-weight:900;font-size:18px">'+(c.qteEnvoyee||c.qte)+'</td><td style="border:1px solid #000;padding:8px">'+(c.stockDepotApres!=null?c.stockDepotApres:'-')+'</td></tr></table><p style="margin-top:16px">Signature Dépôt : _______________<br><br>Signature Gérant : _______________</p>';}
function voirBon(id){var cmd=getCmd().find(function(c){return String(c.id)===String(id);});if(cmd)afficherBon(cmd);}
function marquerLu(id){var list=getCmd();list.forEach(function(c){if(String(c.id)===String(id))c.statut='Lu';});saveCmd(list);render();}
function badgeStatut(s){if(s==='En attente')return '<span class="badge" style="background:rgba(250,204,21,.2);color:#facc15">🟡 EN ATTENTE</span>';if(s==='Expédiée')return '<span class="badge" style="background:rgba(59,130,246,.2);color:#60a5fa">🔵 EXPÉDIÉE</span>';if(s==='Livrée')return '<span class="badge" style="background:rgba(34,197,94,.2);color:#22c55e">🟢 LIVRÉE</span>';if(s==='Lu')return '<span class="badge" style="background:rgba(167,139,250,.2);color:#a78bfa">🟣 LU</span>';return '<span class="badge" style="background:rgba(255,255,255,.1);color:#fff">'+s+'</span>';}
function render(){var fSite=document.getElementById('filtreSite').value;var fType=document.getElementById('filtreType').value;var q=normaliser(document.getElementById('search').value||'');var sp=getSP();var demandes=getCmd().filter(function(c){return c.statut==='En attente'||c.statut==='Expédiée';});if(fSite!=='TOUT')demandes=demandes.filter(function(c){return String(c.siteId||'').toLowerCase()===fSite.toLowerCase();});if(q)demandes=demandes.filter(function(c){return normaliser(getNomSite(c.siteId)+' '+c.produit+' '+(c.demandeur||c.gerant)+' '+(c.message||'')).includes(q);});demandes.sort(function(a,b){return new Date(b.date)-new Date(a.date);});var alertesStock=[];for(var site in sp){if(fSite!=='TOUT'&&String(site).toLowerCase()!==fSite.toLowerCase())continue;sp[site].forEach(function(p){var s=getStock(p);var type=null;if(s<=0)type='RUPTURE';else if(s<=5)type='STOCK_BAS';if(!type)return;if(q&&!normaliser(getNomSite(site)+' '+p.nom).includes(q))return;alertesStock.push({site:site,produit:p.nom,stock:s,type:type});});}var showDemandes=(fType==='TOUT'||fType==='DEMANDE'||fType==='MESSAGE');var showStock=(fType==='TOUT'||fType==='RUPTURE'||fType==='STOCK_BAS');if(fType==='MESSAGE')demandes=demandes.filter(function(c){return c.type==='MESSAGE';});if(fType==='DEMANDE')demandes=demandes.filter(function(c){return c.type!=='MESSAGE';});if(fType==='RUPTURE')alertesStock=alertesStock.filter(function(a){return a.type==='RUPTURE';});if(fType==='STOCK_BAS')alertesStock=alertesStock.filter(function(a){return a.type==='STOCK_BAS';});document.getElementById('totalAlertes').innerText=(showDemandes?demandes.length:0)+(showStock?alertesStock.length:0);var hD='';if(showDemandes){hD+='<h3>🚚 Demandes & Messages - '+demandes.length+'</h3>';if(!demandes.length)hD+='<div style="color:#64748b">Aucune demande</div>';demandes.forEach(function(c){if(c.type==='MESSAGE'){hD+='<div style="background:#111827;border:2px solid #a78bfa;border-radius:16px;padding:14px;margin-bottom:12px"><div style="font-size:18px;font-weight:900">📍 SITE : <span style="color:#a78bfa">'+getNomSite(c.siteId)+'</span></div><div style="font-size:15px;font-weight:900;margin-top:6px">👤 ENVOYÉ PAR : '+(c.demandeur||c.gerant||'Inconnu')+'</div><div style="background:rgba(255,255,255,.06);border-radius:12px;padding:12px;margin-top:10px">💬 "'+(c.message||c.note||'')+'"</div><div style="color:#94a3b8;font-size:12px;margin-top:6px">'+new Date(c.date).toLocaleString('fr-FR')+'</div><button class="btn" style="background:#a78bfa;color:#000;margin-top:10px" onclick="marquerLu(\''+c.id+'\')">✅ MARQUER COMME LU</button></div>';}else if(c.statut==='Expédiée'){hD+='<div style="background:#111827;border:2px solid #3b82f6;border-radius:16px;padding:14px;margin-bottom:12px"><div style="font-size:18px;font-weight:900">📍 SITE : <span style="color:#3b82f6">'+getNomSite(c.siteId)+'</span></div><div style="font-size:15px;font-weight:900;margin-top:6px">👤 DEMANDÉ PAR : '+(c.demandeur||c.gerant||'Inconnu')+'</div><div style="margin-top:10px">📦 <b>'+c.produit+'</b> • Demandé : <b>'+(c.qteDemandee||c.qte)+'</b> • Envoyé : <b style="color:#3b82f6">'+c.qteEnvoyee+'</b> • Reste dépôt : <b>'+(c.stockDepotApres!=null?c.stockDepotApres:'-')+'</b></div><div style="color:#94a3b8;font-size:12px">En attente de confirmation gérant</div><button class="btn" style="background:#fff;color:#000;margin-top:10px" onclick="voirBon(\''+c.id+'\')">📄 VOIR LE BON</button></div>';}else{var sd=getStockDepot(c.produit).stock;var insuffisant=c.qte>sd;hD+='<div style="background:#111827;border:2px solid '+(insuffisant?'#ef4444':'#facc15')+';border-radius:16px;padding:14px;margin-bottom:12px"><div style="font-size:18px;font-weight:900">📍 SITE : <span style="color:#facc15">'+getNomSite(c.siteId)+'</span></div><div style="font-size:15px;font-weight:900;margin-top:6px">👤 DEMANDÉ PAR : '+(c.demandeur||c.gerant||'Inconnu')+'</div><div style="margin-top:10px">📦 <b>'+c.produit+'</b></div><div style="margin-top:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:12px">Demandé : <b style="font-size:18px">'+c.qte+'</b> pcs<br>Stock dépôt : <b style="font-size:18px;color:'+(insuffisant?'#f87171':'#22c55e')+'">'+sd+' pcs</b>'+(insuffisant?'<br><span style="color:#f87171;font-weight:900">⚠️ STOCK INSUFFISANT - Réduis à '+sd+'</span>':'<br><span style="color:#22c55e">✅ Stock suffisant</span>')+'</div><div style="color:#94a3b8;font-size:12px;margin-top:6px">'+new Date(c.date).toLocaleString('fr-FR')+(c.note?' • '+c.note:'')+'</div><div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap"><span>J\'envoie :</span><input id="qte-'+c.id+'" class="qteInput" type="number" value="'+Math.min(c.qte,sd)+'" max="'+sd+'" oninput="if(+this.value>'+sd+'){alert(\'Stock dépôt : '+sd+' max\');this.value='+sd+';}"><span>max '+sd+'</span><button class="btn" style="background:#22c55e;color:#000;flex:1" onclick="validerEtEnvoyer(\''+c.id+'\')">✅ VALIDER & ENVOYER</button></div><button class="btn" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);margin-top:8px" onclick="voirBon(\''+c.id+'\')">📄 VOIR LE BON</button></div>';}});}document.getElementById('sectionDemandes').innerHTML=hD;var hS='';if(showStock){hS+='<h3 style="margin-top:18px">📦 Alertes Stock - '+alertesStock.length+'</h3>';if(!alertesStock.length)hS+='<div style="color:#64748b">Aucune alerte stock</div>';alertesStock.forEach(function(a){var isR=a.type==='RUPTURE';hS+='<div class="row"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+a.produit+'</b><span class="badge" style="'+(isR?'background:rgba(239,68,68,.2);color:#f87171':'background:rgba(250,204,21,.15);color:#facc15')+'">'+(isR?'🔴 RUPTURE':'🟡 STOCK BAS')+'</span></div><div style="color:#94a3b8;font-size:12px;margin-top:4px"><b style="color:#fff">'+getNomSite(a.site)+'</b> • Stock : <b style="color:#fff">'+a.stock+'</b></div></div>';});}document.getElementById('sectionStock').innerHTML=hS;}
function renderHist(){
  var fSite=document.getElementById('filtreSiteHist').value;var fStatut=document.getElementById('filtreStatutHist').value;var fType=document.getElementById('filtreTypeHist').value;var q=normaliser(document.getElementById('searchHist').value||'');
  var list=getCmd().slice();list.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var total=list.length;
  if(fSite!=='TOUT')list=list.filter(function(c){return String(c.siteId||'').toLowerCase()===fSite.toLowerCase();});
  if(fStatut!=='TOUT')list=list.filter(function(c){return c.statut===fStatut;});
  if(fType==='STOCK')list=list.filter(function(c){return c.type!=='MESSAGE';});
  if(fType==='MESSAGE')list=list.filter(function(c){return c.type==='MESSAGE';});
  if(q)list=list.filter(function(c){return normaliser(getNomSite(c.siteId)+' '+c.produit+' '+(c.demandeur||c.gerant)+' '+(c.message||c.note||'')).includes(q);});
  var nbLivree=getCmd().filter(function(c){return c.statut==='Livrée';}).length;var nbExp=getCmd().filter(function(c){return c.statut==='Expédiée';}).length;var nbAtt=getCmd().filter(function(c){return c.statut==='En attente';}).length;
  document.getElementById('histStats').innerHTML='Total : <b style="color:#fff">'+total+'</b> • 🟡 En attente : <b style="color:#facc15">'+nbAtt+'</b> • 🔵 Expédiée : <b style="color:#60a5fa">'+nbExp+'</b> • 🟢 Livrée : <b style="color:#22c55e">'+nbLivree+'</b> • Affichées : <b style="color:#fff">'+list.length+'</b>';
  var h='';if(!list.length)h='<div style="color:#64748b">Aucun historique</div>';
  list.forEach(function(c){
    if(c.type==='MESSAGE'){
      h+='<div style="background:#111827;border:1px solid #a78bfa;border-radius:14px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>💬 MESSAGE</b>'+badgeStatut(c.statut)+'</div><div style="font-size:15px;font-weight:900;margin-top:6px">📍 '+getNomSite(c.siteId)+' • 👤 '+(c.demandeur||c.gerant||'Inconnu')+'</div><div style="background:rgba(255,255,255,.06);border-radius:10px;padding:10px;margin-top:8px">"'+(c.message||c.note||'')+'"</div><div style="color:#94a3b8;font-size:12px;margin-top:6px">'+new Date(c.date).toLocaleString('fr-FR')+'</div></div>';
    }else{
      h+='<div style="background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>📦 '+c.produit+'</b>'+badgeStatut(c.statut)+'</div><div style="font-size:15px;font-weight:900;margin-top:6px">📍 '+getNomSite(c.siteId)+' • 👤 '+(c.demandeur||c.gerant||'Inconnu')+'</div><div style="margin-top:6px">Demandé : <b>'+(c.qteDemandee||c.qte)+' pcs</b>'+(c.qteEnvoyee!=null?' • Envoyé : <b style="color:#60a5fa">'+c.qteEnvoyee+' pcs</b>':'')+(c.stockDepotApres!=null?' • Reste dépôt : <b>'+c.stockDepotApres+'</b>':'')+'</div><div style="color:#94a3b8;font-size:12px;margin-top:4px">Demandé le '+new Date(c.date).toLocaleString('fr-FR')+(c.dateEnvoi?' • Envoyé le '+new Date(c.dateEnvoi).toLocaleString('fr-FR'):'')+(c.dateReception?' • Reçu le '+new Date(c.dateReception).toLocaleString('fr-FR'):'')+(c.note?' • '+c.note:'')+'</div><button class="btn" style="background:#fff;color:#000;margin-top:8px" onclick="voirBon(\''+c.id+'\')">📄 VOIR LE BON</button></div>';
    }
  });
  document.getElementById('sectionHist').innerHTML=h;
}
document.getElementById('search').addEventListener('input',render);document.getElementById('searchHist').addEventListener('input',renderHist);remplirFiltreSite();render();
</script></body></html>
